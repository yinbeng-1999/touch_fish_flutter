
name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No test directory; skipping tests."
          fi

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
      runs-on: macos-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Setup Flutter
          uses: subosito/flutter-action@v2
          with:
            channel: stable
            cache: true

        - name: Install dependencies
          run: flutter pub get

        - name: Build iOS Simulator App
          run: flutter build ios --simulator

        - name: Package iOS App
          run: |
            cd build/ios/iphonesimulator
            zip -r "$GITHUB_WORKSPACE/touch-fish-ios-simulator.zip" Runner.app

        - name: Upload iOS Artifact
          uses: actions/upload-artifact@v4
          with:
            name: touch-fish-ios-simulator
            path: touch-fish-ios-simulator.zip
            if-no-files-found: error
    
